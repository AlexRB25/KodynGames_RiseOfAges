# Render: un solo servicio web (Node) que sirve la landing, el juego web y las salas en línea.
services:
  - type: web
    name: conquista
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /salud
    plan: free
    envVars:
      # Mismo proyecto de Supabase que Zombie War (Kodyn Games). Sin estas dos el rango
      # funciona en "modo prueba" (puntos en memoria). Ver docs/ONLINE.md.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Tienda: compra de gemas con Stripe (la misma cuenta de Stripe que Zombie War).
      # Sin estas dos la tienda dice "aún no está lista". Ver docs/TEMPORADAS.md.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
