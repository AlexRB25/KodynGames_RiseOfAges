encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>#status{background:#1b130c;}#status-splash{object-fit:cover;width:100%;height:100%;max-width:none;max-height:none;}#status-progress{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;width:min(560px,78%);height:26px;-webkit-appearance:none;appearance:none;border:3px solid #8a6a37;border-radius:14px;background:rgba(20,12,6,.75);overflow:hidden;box-shadow:0 0 0 3px #3a2810,0 6px 18px rgba(0,0,0,.6),inset 0 2px 6px rgba(0,0,0,.6);}#status-progress::-webkit-progress-bar{background:rgba(20,12,6,.75);border-radius:12px;}#status-progress::-webkit-progress-value{border-radius:10px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.18) 0 10px,rgba(255,255,255,0) 10px 20px),linear-gradient(180deg,#ffe28a,#f2c25a 45%,#c9842f);}#status-progress::-moz-progress-bar{border-radius:10px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.18) 0 10px,rgba(255,255,255,0) 10px 20px),linear-gradient(180deg,#ffe28a,#f2c25a 45%,#c9842f);}#cq-carga{position:absolute;left:0;right:0;bottom:calc(8% + 38px);text-align:center;font:800 20px Arial,sans-serif;color:#f5e8c7;text-shadow:0 2px 4px #000,0 0 12px #000;letter-spacing:.04em;z-index:2;pointer-events:none;}</style><script>addEventListener('DOMContentLoaded',function(){var st=document.getElementById('status');if(!st)return;var t=document.createElement('div');t.id='cq-carga';t.textContent='Cargando Rise of Ages…';st.appendChild(t);var timer=setInterval(function(){var p=document.getElementById('status-progress');if(!st.isConnected||st.style.display==='none'||st.style.visibility==='hidden'){clearInterval(timer);return;}if(p&&p.max>0&&p.value>0){t.textContent='Cargando Rise of Ages… '+Math.min(100,Math.round(p.value/p.max*100))+' %';}},200);});</script><style>#cq-rotar{display:none;position:fixed;inset:0;z-index:100;background:#1b130c;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#f5e8c7;text-align:center;font:800 26px Arial,sans-serif}#cq-rotar>*{margin:0}#cq-rotar small{font-weight:600;font-size:16px;opacity:.9;padding:0 28px;line-height:1.35}#cq-rotar button{margin-top:16px;font:800 18px Arial,sans-serif;padding:15px 24px;border:0;border-radius:14px;background:#f2c25a;color:#2a1a08;box-shadow:0 4px 0 #8a5f1c}.cq-tel{width:46px;height:80px;border:5px solid #f5e8c7;border-radius:10px;margin-bottom:14px;animation:cq-gira 1.8s ease-in-out infinite}@keyframes cq-gira{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}@media (orientation:portrait){html.cq-touch #cq-rotar{display:flex}}#cq-fs{display:none;position:fixed;right:10px;bottom:10px;z-index:90;font:700 14px Arial,sans-serif;padding:10px 14px;border:0;border-radius:10px;background:rgba(242,194,90,.9);color:#2a1a08}html.cq-touch:not(.cq-full) #cq-fs{display:block}</style><script>(function(){var touch=matchMedia('(pointer: coarse)').matches||/[?&]movil/.test(location.search);if(!touch)return;var d=document.documentElement;d.classList.add('cq-touch');var canFs=!!(d.requestFullscreen||d.webkitRequestFullscreen);function full(){var p=d.requestFullscreen?d.requestFullscreen({navigationUI:'hide'}):d.webkitRequestFullscreen();Promise.resolve(p).then(function(){d.classList.add('cq-full');if(screen.orientation&&screen.orientation.lock)return screen.orientation.lock('landscape');}).catch(function(){});}document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement)d.classList.remove('cq-full');});addEventListener('DOMContentLoaded',function(){var o=document.createElement('div');o.id='cq-rotar';o.innerHTML='<div class=cq-tel></div><p>Gira tu celular</p><small>Rise of Ages se juega en horizontal.'+(canFs?'':' Si no gira, quita el bloqueo de rotación.')+'</small>'+(canFs?'<button type=button>Jugar en pantalla completa</button>':'');var b=o.querySelector('button');if(b)b.onclick=full;document.body.appendChild(o);if(canFs){var f=document.createElement('button');f.id='cq-fs';f.type='button';f.textContent='Pantalla completa';f.onclick=full;document.body.appendChild(f);}});})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
