[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*, server/*, docs/*, supabase/*, tools/*, assets/LEEME.md, assets/modelos/*.vista.png, assets/modelos/*.meshy.json"
