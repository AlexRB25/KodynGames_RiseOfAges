<!DOCTYPE html>

	<head>

		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1b130c;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<style>#status{background:#1b130c;}#status-splash{object-fit:cover;width:100%;height:100%;max-width:none;max-height:none;}#status-progress{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;width:min(560px,78%);height:26px;-webkit-appearance:none;appearance:none;border:3px solid #8a6a37;border-radius:14px;background:rgba(20,12,6,.75);overflow:hidden;box-shadow:0 0 0 3px #3a2810,0 6px 18px rgba(0,0,0,.6),inset 0 2px 6px rgba(0,0,0,.6);}#status-progress::-webkit-progress-bar{background:rgba(20,12,6,.75);border-radius:12px;}#status-progress::-webkit-progress-value{border-radius:10px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.18) 0 10px,rgba(255,255,255,0) 10px 20px),linear-gradient(180deg,#ffe28a,#f2c25a 45%,#c9842f);}#status-progress::-moz-progress-bar{border-radius:10px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.18) 0 10px,rgba(255,255,255,0) 10px 20px),linear-gradient(180deg,#ffe28a,#f2c25a 45%,#c9842f);}#cq-carga{position:absolute;left:0;right:0;bottom:calc(8% + 38px);text-align:center;font:800 20px Arial,sans-serif;color:#f5e8c7;text-shadow:0 2px 4px #000,0 0 12px #000;letter-spacing:.04em;z-index:2;pointer-events:none;}</style><script>addEventListener('DOMContentLoaded',function(){var st=document.getElementById('status');if(!st)return;var t=document.createElement('div');t.id='cq-carga';t.textContent='Cargando Rise of Ages…';st.appendChild(t);var timer=setInterval(function(){var p=document.getElementById('status-progress');if(!st.isConnected||st.style.display==='none'||st.style.visibility==='hidden'){clearInterval(timer);return;}if(p&&p.max>0&&p.value>0){t.textContent='Cargando Rise of Ages… '+Math.min(100,Math.round(p.value/p.max*100))+' %';}},200);});</script><style>#cq-rotar{display:none;position:fixed;inset:0;z-index:100;background:#1b130c;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#f5e8c7;text-align:center;font:800 26px Arial,sans-serif}#cq-rotar>*{margin:0}#cq-rotar small{f ld(f);}});})();</script><style>#status-notice{display:none!important}#cq-error{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(20,12,6,.72);padding:16px}#cq-error .c{max-width:560px;width:100%;background:#2a1e13;border:3px solid #c9a24f;border-radius:18px;padding:18px 20px 22px;text-align:center;color:#f5e8c7;font:600 17px/1.45 Arial,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.6)}#cq-error img{width:min(320px,70%);height:auto;display:block;margin:0 auto 6px}#cq-error h2{margin:4px 0 8px;font:800 26px Arial,sans-serif;color:#f2c25a}#cq-error p{margin:6px 0}#cq-error button{margin-top:14px;font:800 18px Arial,sans-serif;padding:13px 26px;border:0;border-radius:12px;background:#f2c25a;color:#2a1a08;box-shadow:0 4px 0 #8a5f1c}</style><script>addEventListener('DOMContentLoaded',function(){var n=document.getElementById('status-notice');var st=document.getElementById('status');if(!n||!st)return;var shown=false;function show(){var txt=(n.textContent||'').trim();if(!txt||shown)return;shown=true;console.warn('Rise of Ages - detalle del error:',txt);var ua=navigator.userAgent||'';var inapp=new RegExp('FBAN|FBAV|Instagram|TikTok|musical_ly|Line/|Snapchat','i').test(ua);var msg;if(/WebGL/i.test(txt)){msg='Tu navegador no puede mostrar los gráficos del juego.'+(inapp?'<p>Parece que lo abriste dentro de una app. Toca el menú (⋮ o ···) y elige <b>Abrir en el navegador</b>.</p>':'')+'<p>Ábrelo en <b>Chrome</b> o <b>Safari</b> actualizado. En computadora, activa la <b>aceleración por hardware</b> en la configuración del navegador.</p>';}else{msg='Algo falló al cargar el juego. Ya estamos trabajando en ello.<p>Intenta recargar la página en un momento.</p>';}var e=document.createElement('div');e.id='cq-error';e.innerHTML='<div class=c><img src="/img/caido.png" alt=""><h2>¡Ups! Tu aldeano se cansó</h2><p>'+msg+'</p><button type=button>Reintentar</button></div>';e.querySelector('button').onclick=function(){location.reload();};st.appendChild(e);e.style.display='flex';var c=document.getElementById('cq-carga');if(c)c.style.display='none';var pr=document.getElementById('status-progress');if(pr)pr.style.visibility='hidden';}new MutationObserver(show).observe(n,{childList:true,subtree:true,characterData:true});show();});</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":13237880,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
